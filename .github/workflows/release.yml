name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  verify:
    name: Verify Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prefer HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Validate release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"

          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Install dependencies
        run: node scripts/ci/run-npm-ci.mjs

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Lint and typecheck
        run: npm run check

      - name: Run unit and integration tests
        run: npm run test

      - name: Run UI smoke tests
        run: npm run test:ui

      - name: Audit production dependencies
        run: npm audit --omit=dev

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact_platform: linux
          - name: Windows
            os: windows-latest
            artifact_platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prefer HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: node scripts/ci/run-npm-ci.mjs

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Make distributables
        run: npm run make

      - name: Stage distributable artifacts
        shell: bash
        run: |
          node scripts/ci/stage-make-artifacts.mjs \
            --platform "${{ matrix.artifact_platform }}" \
            --source out/make \
            --target staged-artifacts

      - name: Compute artifact name
        id: artifact
        shell: bash
        run: |
          echo "name=sidekick-${{ matrix.artifact_platform }}-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: staged-artifacts/${{ matrix.artifact_platform }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Prerelease
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributable artifacts
        uses: actions/download-artifact@v5
        with:
          path: downloaded-artifacts

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets

          while IFS= read -r -d '' file_path; do
            target="release-assets/$(basename "${file_path}")"
            if [ -e "${target}" ]; then
              echo "Duplicate release asset name: $(basename "${file_path}")"
              exit 1
            fi
            cp "${file_path}" "${target}"
          done < <(find downloaded-artifacts -type f -print0)

          asset_count="$(find release-assets -type f | wc -l)"

          if [ "${asset_count}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi

          ls -la release-assets

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --verify-tag \
            --generate-notes \
            --title "Sidekick ${GITHUB_REF_NAME}"
