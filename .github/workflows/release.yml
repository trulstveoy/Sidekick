name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  verify:
    name: Verify Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prefer HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Validate release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"

          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Install dependencies
        run: node scripts/ci/run-npm-ci.mjs

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Lint and typecheck
        run: npm run check

      - name: Run unit and integration tests
        run: npm run test

      - name: Run UI smoke tests
        run: npm run test:ui

      - name: Audit production dependencies
        run: npm audit --omit=dev

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact_platform: linux
          - name: Windows
            os: windows-latest
            artifact_platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Prefer HTTPS for GitHub git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: node scripts/ci/run-npm-ci.mjs

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Prepare Windows signing material
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ vars.SIDEKICK_REQUIRE_WINDOWS_SIGNING }}
          SIGNING_PFX_BASE64: ${{ secrets.SIDEKICK_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIDEKICK_SIGNING_PASSWORD }}
          SIGNING_TIMESTAMP_URL_SECRET: ${{ secrets.SIDEKICK_SIGNING_TIMESTAMP_URL }}
          SIGNING_TIMESTAMP_URL_VAR: ${{ vars.SIDEKICK_SIGNING_TIMESTAMP_URL }}
        run: |
          $requireSigning = $env:REQUIRE_SIGNING -ieq "true"
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)
          $hasSigningSecrets = $hasPfx -and $hasPassword

          "SIDEKICK_REQUIRE_WINDOWS_SIGNING=$($requireSigning.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "SIDEKICK_SIGNING_ENABLED=$($hasSigningSecrets.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

          if ($requireSigning -and -not $hasSigningSecrets) {
            throw "SIDEKICK_REQUIRE_WINDOWS_SIGNING=true, but SIDEKICK_SIGNING_PFX_BASE64 and SIDEKICK_SIGNING_PASSWORD are not both configured."
          }

          if (($hasPfx -or $hasPassword) -and -not $hasSigningSecrets) {
            throw "Windows signing is partially configured. Set both SIDEKICK_SIGNING_PFX_BASE64 and SIDEKICK_SIGNING_PASSWORD, or remove both."
          }

          if (-not $hasSigningSecrets) {
            Write-Host "Windows signing secrets are not configured. Windows release artifacts will remain unsigned."
            exit 0
          }

          Write-Host "::add-mask::$env:SIGNING_PASSWORD"

          $signingDirectory = Join-Path $env:RUNNER_TEMP "sidekick-signing"
          New-Item -ItemType Directory -Force -Path $signingDirectory | Out-Null

          $pfxPath = Join-Path $signingDirectory "sidekick-signing.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SIGNING_PFX_BASE64))

          "SIDEKICK_SIGNING_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          "SIDEKICK_SIGNING_PASSWORD=$env:SIGNING_PASSWORD" >> $env:GITHUB_ENV

          $timestampUrl = if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_TIMESTAMP_URL_SECRET)) {
            $env:SIGNING_TIMESTAMP_URL_SECRET
          } else {
            $env:SIGNING_TIMESTAMP_URL_VAR
          }

          if (-not [string]::IsNullOrWhiteSpace($timestampUrl)) {
            "SIDEKICK_SIGNING_TIMESTAMP_URL=$timestampUrl" >> $env:GITHUB_ENV
          }

          Write-Host "Windows signing material prepared."

      - name: Make distributables
        run: npm run make

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIDEKICK_SIGNING_EXPECTED_SUBJECT: ${{ vars.SIDEKICK_SIGNING_EXPECTED_SUBJECT || 'CN=Sidekick Local Code Signing' }}
          SIDEKICK_SIGNING_EXPECTED_THUMBPRINT: ${{ vars.SIDEKICK_SIGNING_EXPECTED_THUMBPRINT }}
        run: npm run verify:windows-signatures

      - name: Remove temporary Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIDEKICK_SIGNING_PFX_PATH) -and (Test-Path $env:SIDEKICK_SIGNING_PFX_PATH)) {
            Remove-Item -Force $env:SIDEKICK_SIGNING_PFX_PATH
            Write-Host "Removed temporary Windows signing PFX."
          }

      - name: Verify packaged context package generation
        run: npm run verify:packaged-context

      - name: Stage distributable artifacts
        shell: bash
        run: |
          node scripts/ci/stage-make-artifacts.mjs \
            --platform "${{ matrix.artifact_platform }}" \
            --source out/make \
            --target staged-artifacts

      - name: Compute artifact name
        id: artifact
        shell: bash
        run: |
          echo "name=sidekick-${{ matrix.artifact_platform }}-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: staged-artifacts/${{ matrix.artifact_platform }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Prerelease
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributable artifacts
        uses: actions/download-artifact@v5
        with:
          path: downloaded-artifacts

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets

          while IFS= read -r -d '' file_path; do
            target="release-assets/$(basename "${file_path}")"
            if [ -e "${target}" ]; then
              echo "Duplicate release asset name: $(basename "${file_path}")"
              exit 1
            fi
            cp "${file_path}" "${target}"
          done < <(find downloaded-artifacts -type f -print0)

          asset_count="$(find release-assets -type f | wc -l)"

          if [ "${asset_count}" -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi

          ls -la release-assets

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --verify-tag \
            --generate-notes \
            --title "Sidekick ${GITHUB_REF_NAME}"
