name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Lint and typecheck
        run: npm run check

      - name: Run unit and integration tests
        run: npm run test

      - name: Run UI smoke tests
        run: npm run test:ui

      - name: Audit production dependencies
        run: npm audit --omit=dev

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact_platform: linux
          - name: Windows
            os: windows-latest
            artifact_platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Make distributables
        run: npm run make

      - name: Stage distributable artifacts
        shell: bash
        run: |
          node scripts/ci/stage-make-artifacts.mjs \
            --platform "${{ matrix.artifact_platform }}" \
            --source out/make \
            --target staged-artifacts

      - name: Compute artifact name
        id: artifact
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          echo "name=sidekick-${{ matrix.artifact_platform }}-v${version}-run-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload distributable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: staged-artifacts/${{ matrix.artifact_platform }}
          if-no-files-found: error
          retention-days: 14
