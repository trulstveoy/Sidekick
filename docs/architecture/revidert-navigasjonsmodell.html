<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidekick – Revidert navigasjonsmodell</title>
<style>
  :root {
    --color-bg:        #f4f4f4;
    --color-surface:   #ffffff;
    --color-surface-2: #f9f9f9;
    --color-border:    #e0e0e0;
    --color-border-strong: #c8c8c8;
    --color-text:      #1a1a1a;
    --color-text-2:    #555555;
    --color-text-3:    #888888;
    --color-primary:   #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-primary-light: #eff6ff;
    --color-warning-bg: #fffbeb;
    --color-warning-border: #fbbf24;
    --color-warning-text: #92400e;
    --color-selected:  #eff6ff;
    --color-selected-border: #bfdbfe;
    --color-hover:     #f3f4f6;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Consolas", "SF Mono", monospace;
    --topbar-h: 44px;
    --actionbar-h: 52px;
    --right-w: 260px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    font-size: 13px;
    background: #d8d8d8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 48px;
    gap: 48px;
    min-height: 100vh;
  }

  /* ─── Page header ─── */
  .page-header {
    width: 100%;
    max-width: 960px;
    text-align: left;
  }
  .page-header h1 {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 4px;
  }
  .page-header p {
    font-size: 12px;
    color: #666;
  }

  /* ─── State label ─── */
  .state-label {
    width: 100%;
    max-width: 960px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: -36px;
  }

  /* ─── App window ─── */
  .app-window {
    width: 100%;
    max-width: 960px;
    height: 580px;
    background: var(--color-surface);
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 24px rgba(0,0,0,.12), 0 1px 4px rgba(0,0,0,.06);
  }

  /* ─── Topbar ─── */
  .topbar {
    height: var(--topbar-h);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 0;
    flex-shrink: 0;
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 14px;
    color: var(--color-text);
    letter-spacing: -.01em;
    padding-right: 16px;
    border-right: 1px solid var(--color-border);
    margin-right: 14px;
  }
  .logo-icon {
    width: 20px; height: 20px;
    background: var(--color-primary);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 11px;
    font-weight: 800;
  }
  .topbar-folder {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--color-text-2);
    font-size: 13px;
    transition: background .1s;
  }
  .topbar-folder:hover { background: var(--color-hover); }
  .topbar-folder .folder-name { color: var(--color-text); font-weight: 500; }
  .topbar-folder .chevron { color: var(--color-text-3); font-size: 10px; }
  .topbar-spacer { flex: 1; }
  .topbar-settings {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--color-text-3);
    transition: background .1s, color .1s;
  }
  .topbar-settings:hover { background: var(--color-hover); color: var(--color-text); }

  /* ─── Body ─── */
  .app-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ─── Middle panel ─── */
  .middle-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--color-border);
    overflow: hidden;
    background: var(--color-surface);
  }

  /* File tree */
  .tree-header {
    display: grid;
    grid-template-columns: 1fr 64px 56px;
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--color-border);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--color-text-3);
  }
  .tree-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .tree-row {
    display: grid;
    grid-template-columns: 1fr 64px 56px;
    align-items: center;
    padding: 0 12px;
    height: 30px;
    cursor: pointer;
    border-radius: 0;
    position: relative;
    transition: background .08s;
  }
  .tree-row:hover { background: var(--color-hover); }
  .tree-row:hover .tree-arrow { opacity: 1; }
  .tree-row.selected { background: var(--color-selected); }
  .tree-row.selected .tree-name { color: var(--color-primary); font-weight: 500; }

  .tree-name {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--color-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-indent { display: inline-block; }
  .tree-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    color: var(--color-text-3);
    font-size: 10px;
    flex-shrink: 0;
  }
  .tree-icon { font-size: 13px; flex-shrink: 0; }
  .tree-label { overflow: hidden; text-overflow: ellipsis; }
  .tree-files { color: var(--color-text-3); font-size: 12px; }
  .tree-signal { color: var(--color-text-3); font-size: 12px; }
  .tree-arrow {
    position: absolute;
    right: 12px;
    opacity: 0;
    color: var(--color-text-3);
    font-size: 12px;
    transition: opacity .1s;
  }

  /* ─── Workflow panel (replaces tree) ─── */
  .workflow-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .workflow-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    height: 40px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface-2);
    flex-shrink: 0;
  }
  .workflow-back {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--color-primary);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    transition: background .1s;
  }
  .workflow-back:hover { background: var(--color-primary-light); }
  .workflow-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--color-text);
  }
  .workflow-badge {
    margin-left: auto;
    background: var(--color-warning-bg);
    border: 1px solid var(--color-warning-border);
    color: var(--color-warning-text);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .workflow-body {
    flex: 1;
    padding: 20px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .workflow-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .workflow-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 8px;
    font-size: 13px;
  }
  .workflow-row .key { color: var(--color-text-3); }
  .workflow-row .val { color: var(--color-text); font-weight: 500; }
  .workflow-row .val code {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--color-surface-2);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--color-border);
  }
  .warning-box {
    background: var(--color-warning-bg);
    border: 1px solid var(--color-warning-border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .warning-icon { color: #d97706; font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .warning-content { }
  .warning-title { font-weight: 600; color: var(--color-warning-text); font-size: 12px; margin-bottom: 3px; }
  .warning-text { color: var(--color-warning-text); font-size: 12px; line-height: 1.5; }

  .workflow-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-top: 1px solid var(--color-border);
    background: var(--color-surface-2);
    flex-shrink: 0;
  }

  /* Workflow progress state */
  .progress-bar-wrap {
    height: 4px;
    background: var(--color-border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--color-primary);
    border-radius: 2px;
    animation: progress-indeterminate 1.4s ease-in-out infinite;
    width: 40%;
  }
  @keyframes progress-indeterminate {
    0%   { transform: translateX(-100%); width: 50%; }
    50%  { width: 70%; }
    100% { transform: translateX(260%); width: 50%; }
  }
  .progress-label {
    font-size: 12px;
    color: var(--color-text-2);
    margin-top: 6px;
  }

  /* ─── Right panel ─── */
  .right-panel {
    width: var(--right-w);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--color-surface-2);
    overflow: hidden;
  }
  .right-panel-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .right-panel-type {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--color-text-3);
    margin-bottom: 3px;
  }
  .right-panel-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .right-panel-desc {
    font-size: 12px;
    color: var(--color-text-3);
    margin-top: 2px;
  }
  .right-panel-body {
    flex: 1;
    padding: 12px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
  }
  .right-panel-body::after {
    content: '';
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    height: 28px;
    background: linear-gradient(transparent, var(--color-surface-2));
    pointer-events: none;
    display: block;
    margin-top: -28px;
  }

  .meta-group { display: flex; flex-direction: column; gap: 6px; }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
  }
  .meta-key { color: var(--color-text-3); flex-shrink: 0; }
  .meta-val { color: var(--color-text); font-weight: 500; text-align: right; }

  .divider {
    height: 1px;
    background: var(--color-border);
    margin: 2px 0;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-md);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: background .1s, color .1s;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--color-primary);
    color: white;
  }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-secondary {
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border-strong);
  }
  .btn-secondary:hover { background: var(--color-hover); }
  .btn-ghost {
    background: transparent;
    color: var(--color-text-2);
    border: 1px solid transparent;
  }
  .btn-ghost:hover { background: var(--color-hover); color: var(--color-text); }
  .btn-full { width: 100%; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* ─── Action bar ─── */
  .actionbar {
    height: var(--actionbar-h);
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
    flex-shrink: 0;
  }
  .actionbar-spacer { flex: 1; }

  /* ─── Annotations ─── */
  .annotation {
    position: absolute;
    font-size: 11px;
    color: #e5620a;
    font-weight: 600;
    pointer-events: none;
    white-space: nowrap;
  }
  .ann-line {
    position: absolute;
    border: 1px dashed #e5620a;
    pointer-events: none;
  }

  /* ─── Nav between states ─── */
  .state-nav {
    width: 100%;
    max-width: 960px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .state-btn {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    font-family: var(--font);
    font-size: 12px;
    color: var(--color-text-2);
    cursor: pointer;
    transition: all .1s;
  }
  .state-btn:hover { background: var(--color-hover); color: var(--color-text); }
  .state-btn.active {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: white;
    font-weight: 500;
  }

  .empty-hint {
    font-size: 12px;
    color: var(--color-text-3);
    line-height: 1.6;
  }

  .project-stat {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }
  .stat-key { color: var(--color-text-3); }
  .stat-val { color: var(--color-text); font-weight: 500; }

</style>
</head>
<body>

<div class="page-header">
  <h1>Sidekick – Revidert navigasjonsmodell</h1>
  <p>Interaktivt designforslag · Mai 2026</p>
</div>

<!-- State nav -->
<div class="state-nav" id="stateNav">
  <button class="state-btn active" onclick="setState('default')">1 · Standardtilstand</button>
  <button class="state-btn" onclick="setState('folder')">2 · Mappe valgt</button>
  <button class="state-btn" onclick="setState('file')">3 · Fil valgt</button>
  <button class="state-btn" onclick="setState('workflow-confirm')">4 · Arbeidsflyt – bekreft</button>
  <button class="state-btn" onclick="setState('workflow-progress')">5 · Arbeidsflyt – genererer</button>
  <button class="state-btn" onclick="setState('workflow-done')">6 · Arbeidsflyt – ferdig</button>
</div>

<!-- App window -->
<div class="app-window" id="appWindow">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-icon">S</div>
      Sidekick
    </div>
    <div class="topbar-folder">
      <span style="color:var(--color-text-3);font-size:13px;">📁</span>
      <span class="folder-name">MyNewProject</span>
      <span class="chevron">▾</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-settings" title="Innstillinger">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.5 1.5L7 3.5C7.4 3.6 7.7 3.8 8 4L10 3.3L11.5 5.7L10 6.8C10.1 7.2 10.1 7.8 10 8.2L11.5 9.3L10 11.7L8 11C7.7 11.2 7.4 11.4 7 11.5L6.5 13.5H3.5L3 11.5C2.6 11.4 2.3 11.2 2 11L0 11.7L-1.5 9.3L0 8.2C-0.1 7.8 -0.1 7.2 0 6.8L-1.5 5.7L0 3.3L2 4C2.3 3.8 2.6 3.6 3 3.5L3.5 1.5H6.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" transform="translate(3,1.5)"/>
        <circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </div>
  </div>

  <!-- Body -->
  <div class="app-body">

    <!-- Middle panel -->
    <div class="middle-panel" id="middlePanel">

      <!-- File tree (shown in states 1–3) -->
      <div id="treeView">
        <div class="tree-header">
          <span>Mappe</span>
          <span>Filer</span>
          <span>Signal</span>
        </div>
        <div class="tree-body" id="treeBody">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Workflow view (shown in states 4–6) -->
      <div id="workflowView" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
        <!-- populated by JS -->
      </div>

    </div>

    <!-- Right panel -->
    <div class="right-panel" id="rightPanel">
      <!-- populated by JS -->
    </div>

  </div>

  <!-- Action bar -->
  <div class="actionbar" id="actionbar">
    <button class="btn btn-secondary btn-sm" onclick="setState('workflow-confirm')">Importer transkripsjon</button>
    <button class="btn btn-secondary btn-sm" onclick="setState('workflow-confirm')">Generer kontekstpakke</button>
    <button class="btn btn-secondary btn-sm">Kjør Codex</button>
    <div class="actionbar-spacer"></div>
    <button class="btn btn-ghost btn-sm" title="Flere handlinger">···</button>
  </div>

</div>


<script>
const states = {
  'default': {
    label: '1 · Standardtilstand',
    tree: defaultTree(),
    rightPanel: rightDefault(),
    workflow: null,
  },
  'folder': {
    label: '2 · Mappe valgt – 01. Transkripsjoner/',
    tree: folderTree(),
    rightPanel: rightFolder(),
    workflow: null,
  },
  'file': {
    label: '3 · Fil valgt',
    tree: fileTree(),
    rightPanel: rightFile(),
    workflow: null,
  },
  'workflow-confirm': {
    label: '4 · Arbeidsflyt aktiv – bekreft generering',
    tree: null,
    rightPanel: rightFolder(),
    workflow: workflowConfirm(),
  },
  'workflow-progress': {
    label: '5 · Arbeidsflyt aktiv – generering pågår',
    tree: null,
    rightPanel: rightFolder(),
    workflow: workflowProgress(),
  },
  'workflow-done': {
    label: '6 · Arbeidsflyt ferdig – resultat',
    tree: null,
    rightPanel: rightFolder(),
    workflow: workflowDone(),
  },
};

function defaultTree() {
  return `
    <div class="tree-row" onclick="setState('default')">

        <span class="tree-toggle">▾</span>

      <span class="tree-files">1 fil</span>
      <span class="tree-signal"></span>
      <span class="tree-arrow">→</span>
    </div>
    <div class="tree-row" onclick="setState('default')" style="padding-left:28px;">
      <span class="tree-name">
        <span class="tree-toggle">▶</span>
        <span class="tree-icon">📁</span>
        <span class="tree-label">00. Forutsetninger/</span>
      </span>
      <span class="tree-files" style="color:var(--color-text-3); font-style:italic;">Tom</span>
      <span class="tree-signal"></span>
      <span class="tree-arrow">→</span>
    </div>
    <div class="tree-row" onclick="setState('folder')" style="padding-left:28px;">
      <span class="tree-name">
        <span class="tree-toggle">▶</span>
        <span class="tree-icon">📁</span>
        <span class="tree-label">01. Transkripsjoner/</span>
      </span>
      <span class="tree-files">1 fil</span>
      <span class="tree-signal"></span>
      <span class="tree-arrow">→</span>
    </div>
    <div class="tree-row" onclick="setState('default')" style="padding-left:28px;">
      <span class="tree-name">
        <span class="tree-toggle">▶</span>
        <span class="tree-icon">📁</span>
        <span class="tree-label">02. Analyse/</span>
      </span>
      <span class="tree-files" style="color:var(--color-text-3); font-style:italic;">Tom</span>
      <span class="tree-signal"></span>
      <span class="tree-arrow">→</span>
    </div>
  `;
}

function folderTree() {
  return `
    <div class="tree-row" onclick="setState('default')">
      <span class="tree-name">
        <span class="tree-toggle">▾</span>
        <span class="tree-icon">📁</span>
        <span class="tree-label">MyNewProject/</span>
      </span>
      <span class="tree-files">1 fil</span>
      <span class="tree-signal"></span>
      <span class="tree-arrow">→</span>
    </div>
    <div class="tree-row" onclick="setState('default')" style="padding-left:28px;">
      <span class="tree-name">
        <span class="tree-toggle">▶</span>
        <span class="tree-icon">📁</span>
        <span class="tree-label">00. Forutsetninger/</span>
      </span>
      <span class="tree-files" style="color:var(--color-text-3); font-style:italic;">Tom</span>
      <span class="tree-signal"></span>
      <span class="tree-arrow">→</span>
    </div>
    <div class="tree-row selected" onclick="setState('folder')" style="padding-left:28px;">
      <span class="tree-name">
        <span class="tree-toggle">▾</span>
        <span class="tree-icon">📁</span>
        <span class="tree-label">01. Transkripsjoner/</span>
      </span>
      <span class="tree-files">1 fil</span>

function setState(id) {
  const state = states[id];
  if (!state) return;

  // Update nav buttons
  document.querySelectorAll('.state-btn').forEach((btn, i) => {
    btn.classList.remove('active');
  });
  const keys = Object.keys(states);
  const idx = keys.indexOf(id);
  document.querySelectorAll('.state-btn')[idx].classList.add('active');

  // Middle panel
  const treeView = document.getElementById('treeView');
  const workflowView = document.getElementById('workflowView');

  if (state.workflow) {
    treeView.style.display = 'none';
    workflowView.style.display = 'flex';
    workflowView.innerHTML = state.workflow;
  } else {
    treeView.style.display = 'flex';
    treeView.style.flexDirection = 'column';
    treeView.style.flex = '1';
    workflowView.style.display = 'none';
    document.getElementById('treeBody').innerHTML = state.tree;
  }

  // Right panel
  document.getElementById('rightPanel').innerHTML = state.rightPanel;
}
